name: Release

on:
 release:
    types: created

jobs:
  build-android:
    permissions:
      contents: write 
    uses: ./.github/workflows/build-android.yml
    with:
        push: true
        upload: true
        sign: true
    secrets: inherit

  build-linux:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
          flutter-version: '3.50.1'

      - name: Build Linux release
        run: flutter build linux --release
        working-directory: flutter_frontend

      - name: Package Linux release
        run: |
          archive="$RUNNER_TEMP/helse-${GITHUB_REF_NAME}-linux-x64.tar.gz"
          tar -C flutter_frontend/build/linux/x64/release/bundle -czf "$archive" .
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Upload Linux release
        run: gh release upload "$GITHUB_REF_NAME" "$ARCHIVE"
        env:
          GH_TOKEN: ${{ github.token }}

  build-docker:
    permissions:
      contents: read 
      packages: write
    uses: ./.github/workflows/build-docker.yml
    with:
      push: true
   
