name: Build Linux

on:
  workflow_call:
    inputs:
      upload:
        description: Upload the package to the GitHub release
        required: true
        type: boolean
      artifact:
        description: Upload the package as a workflow artifact
        required: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
          flutter-version: '3.50.1'

      - name: Build Linux release
        run: flutter build linux --release
        working-directory: flutter_frontend

      - name: Package Linux release
        id: package
        run: |
          ref_name="${GITHUB_REF_NAME//\//-}"
          archive="$RUNNER_TEMP/helse-${ref_name}-linux-x64.tar.gz"
          tar -C flutter_frontend/build/linux/x64/release/bundle -czf "$archive" .
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "ref_name=$ref_name" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        if: ${{ inputs.artifact }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: helse-${{ steps.package.outputs.ref_name }}-linux-x64
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

      - name: Upload Linux release
        if: ${{ inputs.upload }}
        run: gh release upload "$GITHUB_REF_NAME" "$ARCHIVE"
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
